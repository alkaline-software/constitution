<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starter README GIF</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=block">
<style>
  body { margin: 0; background: #F3F1EA; }
  canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="840"></canvas>
<script>
// The README's moving picture (docs/design.md, The README's picture), in the
// hand of the studio's sites: hairlines on warm paper, each part a pale wash
// of its color with an edge of it, a serif title and an italic serif line
// beside a mono one. Starter's story is the template's window: the sidebar
// folded and back (⌘B), the settings (⌘,), and an accent chosen there,
// which the window wears. A product replaces the story with its own and
// keeps the rest. Laid out in a 1920 by 1008 box and drawn at the canvas's
// size. `frame(i)` draws frame i at FPS and returns it as a PNG; `ready`
// waits for the faces and the icon. scripts/make-readme-gif.sh renders
// every frame and makes the GIF.

const FPS = 30, LENGTH = 12;   // seconds, looped
const W = 1920, H = 1008;
const PAPER = '#F3F1EA', SHEET = '#F8F6F0', INK = '#1F1E1D', MUTED = '#77746B', LINE = '#8E8A80';
const PERIWINKLE = '#5061B3', MOSS = '#5A723A';     // look::ACCENTS, the light shades
const SERIF = '"Source Serif 4", "Source Serif Pro", Georgia, serif';
const MONO = '"JetBrains Mono", Menlo, monospace';
const KEYS = 'system-ui, -apple-system, sans-serif';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const icon = new Image();
// From a file the icon would taint the canvas, and no frame could be read
// back: the renderer hands it in as data (ICON).
icon.src = window.ICON || '../../crates/starter-app/assets/icon/icon-256.png';

window.ready = Promise.all([
  document.fonts.load(`600 84px ${SERIF}`), document.fonts.load(`400 52px ${SERIF}`),
  document.fonts.load(`italic 400 28px ${SERIF}`), document.fonts.load(`400 28px ${MONO}`),
  new Promise(r => { if (icon.complete) r(); else { icon.onload = r; icon.onerror = r; } }),
]);

// The studio's ease out quint, and an ease in and out for the pointer.
function bezier(x1, y1, x2, y2) {
  const a = (p1, p2) => 1 - 3 * p2 + 3 * p1, b = (p1, p2) => 3 * p2 - 6 * p1, c = p1 => 3 * p1;
  const at = (t, p1, p2) => ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t;
  const slope = (t, p1, p2) => 3 * a(p1, p2) * t * t + 2 * b(p1, p2) * t + c(p1);
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (at(t, x1, x2) - x) / s; }
    return at(Math.min(1, Math.max(0, t)), y1, y2);
  };
}
const QUINT = bezier(0.23, 1, 0.32, 1), INOUT = bezier(0.45, 0, 0.25, 1);
const clamp01 = v => Math.min(1, Math.max(0, v));
const span = (t, t0, d) => clamp01((t - t0) / d);
const mix = (a, b, k) => a + (b - a) * k;
const mixP = (a, b, k) => ({ x: mix(a.x, b.x, k), y: mix(a.y, b.y, k) });
function mixHex(a, b, k) {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return '#' + x.map((v, i) => Math.round(mix(v, y[i], k)).toString(16).padStart(2, '0')).join('');
}

// The window, and the settings window over it.
const WIN = { x: 86, y: 322, w: 1180, h: 610, r: 22 };
const SIDE = 260;
const SET = { x: 470, y: 420, w: 620, h: 420 };

// The script, in seconds: each part's state is worked out from it for any
// moment, so a frame can be drawn on its own.
const T = { fold: 1.4, unfold: 3.0, settings: 4.6, choose: 6.4, close: 8.2, reset: 10.4 };
const SLIDE = 0.22, DIP = 0.35, BACK = 0.45;   // the sidebar's fold, as the window folds it

const sidebar = t => t < T.fold ? 1 : t < T.unfold ? 1 - QUINT(span(t, T.fold, SLIDE)) : QUINT(span(t, T.unfold, SLIDE));
const settings = t => t < T.settings ? 0 : t < T.close ? QUINT(span(t, T.settings, 0.22)) : 1 - QUINT(span(t, T.close, 0.11 * 2));
const chosen = t => t < T.choose ? 0 : t < T.reset ? QUINT(span(t, T.choose, 0.22)) : 1;
// For the loop the window's insides fade out as they ended and in as they began.
const inside = t => t < T.reset ? 1 : t < T.reset + DIP ? 1 - span(t, T.reset, DIP) : span(t, T.reset + DIP, BACK);
const accent = t => mixHex(PERIWINKLE, MOSS, t < T.reset + DIP ? chosen(t) : 0);

const P = (x, y) => ({ x, y });
// The pointer's tip on moss, the fifth swatch.
const REST = P(1296, 948), SWATCH = P(SET.x + 212 + 4 * 46 + 2, SET.y + 198);
const STOPS = [[0, REST], [5.4, REST], [6.2, SWATCH], [7.2, SWATCH], [8.0, REST], [LENGTH, REST]];
function pointer(t) {
  for (let i = 1; i < STOPS.length; i++) {
    const [t0, p0] = STOPS[i - 1], [t1, p1] = STOPS[i];
    if (t <= t1) return mixP(p0, p1, INOUT(span(t, t0, t1 - t0)));
  }
  return STOPS[STOPS.length - 1][1];
}
const pressing = t => t >= T.choose - 0.1 && t < T.choose + 0.06;

const ROWS = [
  { keys: ['⌘', 'B'], says: 'the sidebar folds, and comes back', on: [[T.fold - 0.2, T.fold + 0.9], [T.unfold - 0.2, T.unfold + 0.9]] },
  { keys: ['⌘', ','], says: 'the settings', on: [[T.settings - 0.2, T.choose]] },
  { word: 'an accent', says: 'the window wears it', on: [[T.choose - 0.3, T.close + 0.6]] },
];

function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function hex(c, a) {
  const n = parseInt(c.slice(1), 16);
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function hair(x1, y1, x2, y2, color, w = 1.6) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function dot(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function words(text, x, y, font, color, align = 'left') {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y); ctx.textAlign = 'left';
}

function header() {
  if (icon.complete && icon.naturalWidth) ctx.drawImage(icon, 78, 66, 84, 84);
  words('Starter', 182, 128, `400 54px ${SERIF}`, INK);
  words('for macOS, Windows and Linux', W - 86, 120, `400 30px ${MONO}`, PERIWINKLE, 'right');
  words('Where every app begins', 82, 262, `600 84px ${SERIF}`, INK);
}

// The main window: its frame, the sidebar on it, the page as a card.
function mainWindow(t) {
  const a = accent(t), s = sidebar(t);
  rr(WIN.x, WIN.y, WIN.w, WIN.h, WIN.r); ctx.fillStyle = hex(LINE, 0.16); ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); rr(WIN.x + 1, WIN.y + 1, WIN.w - 2, WIN.h - 2, WIN.r); ctx.clip();
  ctx.globalAlpha = inside(t);
  for (const k of [0, 1, 2]) dot(WIN.x + 26 + k * 18, WIN.y + 24, 5, hex(LINE, 0.95));
  // The sidebar's rows, the first chosen on its plate.
  ctx.save(); ctx.globalAlpha *= s;
  ['Home', 'Library', 'Settings'].forEach((name, i) => {
    const y = WIN.y + 86 + i * 40;
    if (i === 0) { rr(WIN.x + 14, y - 26, SIDE - 40, 36, 9); ctx.fillStyle = hex(a, 0.14); ctx.fill(); }
    rr(WIN.x + 28, y - 16, 16, 16, 4); ctx.strokeStyle = i === 0 ? a : hex(LINE, 0.8); ctx.lineWidth = 1.6; ctx.stroke();
    words(name, WIN.x + 56, y - 2, `400 22px ${SERIF}`, i === 0 ? INK : MUTED);
  });
  ctx.restore();
  // The page as a card, growing into the sidebar's room as it folds.
  const card = { x: WIN.x + 10 + (SIDE - 10) * s, y: WIN.y + 48, w: WIN.w - 20 - (SIDE - 10) * s, h: WIN.h - 58 };
  rr(card.x, card.y, card.w, card.h, 14); ctx.fillStyle = SHEET; ctx.fill(); ctx.strokeStyle = hex(LINE, 0.55); ctx.lineWidth = 1.6; ctx.stroke();
  const x = card.x + 40;
  words('Home', x, card.y + 62, `600 34px ${SERIF}`, INK);
  hair(x, card.y + 104, x + card.w * 0.5, card.y + 104, hex(LINE, 0.5)); hair(x, card.y + 128, x + card.w * 0.36, card.y + 128, hex(LINE, 0.5));
  // A row on a card: its name, and a switch on in the accent.
  for (const i of [0, 1]) {
    const y = card.y + 180 + i * 70;
    rr(x, y, card.w - 80, 56, 10); ctx.strokeStyle = hex(LINE, 0.45); ctx.lineWidth = 1.5; ctx.stroke();
    hair(x + 20, y + 28, x + 20 + [180, 140][i], y + 28, hex(LINE, 0.7), 2);
    rr(x + card.w - 80 - 70, y + 16, 50, 26, 13); ctx.fillStyle = i === 0 ? a : hex(LINE, 0.25); ctx.fill();
    dot(x + card.w - 80 - (i === 0 ? 33 : 57), y + 29, 10, '#fff');
  }
  // The buttons: a pill with an icon before its word, the first in the accent.
  for (const i of [0, 1]) {
    const bx = x + i * 190, by = card.y + 350;
    rr(bx, by, 170, 44, 22); ctx.fillStyle = i === 0 ? a : SHEET; ctx.fill(); ctx.strokeStyle = i === 0 ? a : hex(LINE, 0.6); ctx.lineWidth = 1.6; ctx.stroke();
    dot(bx + 30, by + 22, 6, i === 0 ? '#fff' : hex(LINE, 0.8));
    hair(bx + 48, by + 22, bx + 130, by + 22, i === 0 ? '#fff' : hex(LINE, 0.7), 2);
  }
  ctx.restore();
}

// The settings window: its rail, the Appearance section's accents, the one
// chosen ringed.
function settingsWindow(t) {
  const k = settings(t);
  if (k < 0.001) return;
  const a = accent(t);
  ctx.save(); ctx.globalAlpha = k * inside(t);
  const y = SET.y + (1 - k) * 18;
  rr(SET.x, y, SET.w, SET.h, 18); ctx.fillStyle = SHEET; ctx.fill(); ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.stroke();
  for (const i of [0, 1, 2]) dot(SET.x + 24 + i * 16, y + 22, 4.5, hex(LINE, 0.95));
  hair(SET.x + 170, y + 2, SET.x + 170, y + SET.h - 2, hex(LINE, 0.35), 1.4);
  ['Appearance', 'Text', 'About'].forEach((name, i) => {
    const ry = y + 76 + i * 38;
    if (i === 0) { rr(SET.x + 10, ry - 24, 150, 34, 8); ctx.fillStyle = hex(a, 0.14); ctx.fill(); }
    words(name, SET.x + 24, ry - 2, `400 19px ${SERIF}`, i === 0 ? INK : MUTED);
  });
  words('Appearance', SET.x + 196, y + 34, `600 22px ${SERIF}`, INK);
  words('Accent', SET.x + 196, y + 140, `400 20px ${SERIF}`, MUTED);
  const swatches = ['#5061B3', '#845293', '#9C4A66', '#A86003', '#5A723A', '#327860'];
  swatches.forEach((c, i) => {
    const cx = SET.x + 212 + i * 46, cy = y + 196;
    dot(cx, cy, 15, c);
    const on = i === 0 ? 1 - chosen(t) : i === 4 ? chosen(t) : 0;
    if (on > 0) { ctx.strokeStyle = hex(c, on); ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(cx, cy, 21, 0, Math.PI * 2); ctx.stroke(); }
  });
  ctx.restore();
}

function arrow(p, down) {
  ctx.save(); ctx.translate(p.x - 3, p.y - 3); const k = down ? 2.35 : 2.6; ctx.scale(k, k);
  ctx.beginPath();
  ctx.moveTo(1.5, 1.5); ctx.lineTo(1.5, 12.2); ctx.lineTo(4.1, 9.8); ctx.lineTo(6, 14); ctx.lineTo(7.9, 13.2); ctx.lineTo(6.1, 9.1); ctx.lineTo(9.6, 9.1); ctx.closePath();
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = '#111'; ctx.fill();
  ctx.restore();
}

function key(x, y, sym, color, lit) {
  const s = 44;
  rr(x, y, s, s, 9);
  ctx.fillStyle = SHEET; ctx.fill();
  ctx.strokeStyle = lit ? color : hex(LINE, 0.9); ctx.lineWidth = lit ? 2 : 1.6; ctx.stroke();
  ctx.fillStyle = lit ? color : INK; ctx.font = `500 22px ${KEYS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(sym, x + s / 2, y + s / 2 + 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

// The list at the right: each move, lit while it plays, a shade darker once
// it has.
function list(t) {
  const X = 1350;
  const a = accent(t);
  ROWS.forEach((row, i) => {
    const lit = row.on.some(([p, q]) => t >= p && t < q);
    const begun = t >= row.on[0][0] && t < T.reset;
    const alpha = lit ? 1 : begun ? 0.78 : 0.36;
    const y = 430 + i * 130;
    ctx.save(); ctx.globalAlpha = alpha;
    if (row.keys) row.keys.forEach((s, j) => key(X + j * 54, y - 34, s, a, lit));
    else words(row.word, X, y, `400 30px ${MONO}`, lit ? a : INK);
    words(row.says, X, y + 48, `italic 400 30px ${SERIF}`, lit ? INK : MUTED);
    ctx.restore();
  });
}

function draw(t) {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  header();
  mainWindow(t);
  settingsWindow(t);
  list(t);
  arrow(pointer(t), pressing(t));
}

window.frame = i => { draw(i / FPS); return canvas.toDataURL('image/png'); };
window.FRAMES = FPS * LENGTH;
window.FPS = FPS;
window.ready.then(() => {
  // In a browser, the picture plays; the renderer draws frame by frame.
  if (!navigator.webdriver && !window.RENDERING) {
    const start = performance.now();
    const tick = now => { draw(((now - start) / 1000) % LENGTH); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
});
</script>
</body>
</html>
